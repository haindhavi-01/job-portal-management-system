<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobPortal - Find Your Dream Job</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        nav {
            background: #1f2937;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: #ffffff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box input {
            width: 400px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .search-box button {
            padding: 14px 25px;
            border: none;
            border-radius: 6px;
            background: #111827;
            color: white;
            cursor: pointer;
        }

        .jobs-section {
            padding: 50px 8%;
        }

        .jobs-section h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .job-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .job-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .job-card h3 {
            color: #2563eb;
            margin-bottom: 12px;
        }

        .job-card p {
            margin: 8px 0;
        }

        .apply-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            background: #1f2937;
            color: white;
            padding: 20px;
            margin-top: 40px;
        }

    </style>
</head>

<body>

    <nav>

        <h2>JobPortal</h2>

        <div>
            <a href="/">Home</a>
            <a href="/api/jobs/">API</a>
            <a href="/admin/">Admin</a>
        </div>

    </nav>


    <section class="hero">

        <h1>Find Your Dream Job</h1>

        <p>
            Search and discover opportunities that match your skills.
        </p>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search jobs..."
            >

            <button onclick="searchJobs()">
                Search
            </button>

        </div>

    </section>


    <section class="jobs-section">

        <h2>Latest Job Opportunities</h2>

        <div
            class="job-container"
            id="jobContainer"
        >

            <p>Loading jobs...</p>

        </div>

    </section>


    <footer>

        <p>
            © 2026 JobPortal | Built with Python & Django
        </p>

    </footer>


    <script>

        function loadJobs(url = "/api/jobs/") {

            fetch(url)

                .then(response => response.json())

                .then(data => {

                    const container =
                        document.getElementById("jobContainer");

                    container.innerHTML = "";

                    if (data.length === 0) {

                        container.innerHTML =
                            "<p>No jobs found.</p>";

                        return;
                    }


                    data.forEach(job => {

                        const card =
                            document.createElement("div");

                        card.className = "job-card";

                        card.innerHTML = `

                            <h3>${job.title}</h3>

                            <p>
                                <strong>Company:</strong>
                                ${job.company}
                            </p>

                            <p>
                                <strong>Location:</strong>
                                ${job.location}
                            </p>

                            <p>
                                <strong>Category:</strong>
                                ${job.category}
                            </p>

                            <p>
                                <strong>Salary:</strong>
                                ${job.salary}
                            </p>

                            <a
                                href="/api/jobs/${job.id}/"
                                class="apply-btn"
                            >
                                View Details
                            </a>

                        `;

                        container.appendChild(card);

                    });

                })

                .catch(error => {

                    console.error(error);

                    document.getElementById("jobContainer")
                        .innerHTML =
                        "<p>Unable to load jobs.</p>";

                });

        }


        function searchJobs() {

            const search =
                document.getElementById("searchInput").value;

            if (search.trim() === "") {

                loadJobs();

                return;
            }

            const url =
                `/api/jobs/?search=${encodeURIComponent(search)}`;

            loadJobs(url);

        }


        loadJobs();

    </script>

</body>

</html>
